<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TayeaLab — نظام معلومات المعامل</title>
<link rel="icon" type="image/png" href="lis-assets/icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d1b3a">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0d1b3a; --navy2:#12234d; --card:#ffffff; --line:#dbe3f0;
  --blue:#3b6fd4; --gold:#f5a623; --txt:#1c2437; --mut:#6b7a99;
  --green:#2f9e6e; --red:#d64545; --amber:#d99a17;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;background:#eef2f8;color:var(--txt);min-height:100vh}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px}
a{color:var(--blue)}

/* ===== login ===== */
#login-view{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(900px 500px at 80% 10%,#1c3a7d 0%,var(--navy) 55%)}
.login-box{background:#fff;border-radius:22px;padding:44px 40px;width:420px;max-width:92vw;
  box-shadow:0 30px 80px rgba(0,0,0,.45);text-align:center}
.login-box img{width:180px;margin-bottom:6px}
.login-box h1{font-size:21px;color:var(--navy);margin-bottom:26px;font-weight:800}
.field{text-align:right;margin-bottom:18px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--mut);margin-bottom:6px}
.field input,.field select{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;outline:none;background:#fbfcfe;transition:.2s}
.field input:focus,.field select:focus{border-color:var(--blue);background:#fff}
.btn{display:inline-block;border:0;border-radius:12px;padding:12px 26px;font-weight:800;font-size:15px;transition:.2s}
.btn-p{background:linear-gradient(135deg,#0fa08c,#0b6e62);color:#fff;width:100%;box-shadow:0 8px 20px rgba(15,160,140,.35)}
.btn-p:hover{transform:translateY(-2px)}
.btn-g{background:var(--gold);color:#231300}
.btn-o{background:#eef2f8;color:var(--txt);border:1.5px solid var(--line)}
.btn-s{padding:7px 14px;font-size:13px;border-radius:9px}
.btn-red{background:#fdecec;color:var(--red)}
.err{background:#fdecec;color:var(--red);border-radius:10px;padding:10px;font-size:14px;margin-bottom:14px;font-weight:700}
.hint{font-size:12.5px;color:var(--mut);margin-top:14px}

/* ===== app shell ===== */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;
  background:linear-gradient(135deg,#12234d,#0d1b3a);color:#fff;padding:10px 20px;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.topbar img{height:34px}
.topbar .t{font-weight:900;font-size:17px}
.topbar .sp{flex:1}
.topbar .who{font-size:13px;color:#bcd0f7;font-weight:700}
.icon-btn{background:rgba(255,255,255,.12);border:0;color:#fff;width:36px;height:36px;border-radius:10px;font-size:16px}
.icon-btn:hover{background:rgba(255,255,255,.25)}

#view{padding:22px;max-width:1300px;margin:0 auto}
.page-head{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.page-head h2{font-size:22px;font-weight:900;color:var(--navy)}
.back{background:#fff;border:1.5px solid var(--line);border-radius:10px;width:38px;height:38px;font-size:18px;color:var(--navy)}

/* ===== home tiles ===== */
.lab-head{background:linear-gradient(135deg,#132a5e,#0d1b3a);color:#fff;border-radius:18px;
  padding:20px 26px;display:flex;align-items:center;gap:18px;margin-bottom:20px}
.lab-head img{width:64px;height:64px;background:#fff;border-radius:14px;padding:6px}
.lab-head .n{font-size:22px;font-weight:900}
.lab-head .b{color:var(--gold);font-weight:700;font-size:14px}
.lab-head .u{color:#bcd0f7;font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.tile{border-radius:16px;padding:18px 20px;display:flex;align-items:center;gap:14px;cursor:pointer;
  border:1px solid rgba(0,0,0,.06);transition:.2s;color:#1c2437}
.tile:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(13,27,58,.18)}
.tile .ic{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-size:24px;color:#fff;flex-shrink:0}
.tile h3{font-size:17px;font-weight:800}
.tile p{font-size:12.5px;color:rgba(28,36,55,.65);margin-top:2px}
.tile .arr{margin-inline-start:auto;font-size:20px;opacity:.5}

/* ===== cards/tables ===== */
.card{background:#fff;border-radius:16px;border:1px solid var(--line);padding:20px;margin-bottom:18px}
.card h3{font-size:16px;font-weight:800;color:var(--navy);margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:#f2f5fb;color:var(--navy);font-weight:800;padding:10px 12px;text-align:right;font-size:13px;white-space:nowrap}
td{padding:9px 12px;border-top:1px solid #eef2f8;vertical-align:middle}
tr:hover td{background:#f8fafd}
.pill{display:inline-block;padding:3px 12px;border-radius:999px;font-size:12px;font-weight:800}
.p-wait{background:#fff4dd;color:var(--amber)}
.p-prog{background:#e3edff;color:var(--blue)}
.p-done{background:#e2f6ec;color:var(--green)}
.p-paid{background:#e2f6ec;color:var(--green)}
.p-unpaid{background:#fdecec;color:var(--red)}
.flag-H{color:var(--red);font-weight:900}
.flag-L{color:var(--blue);font-weight:900}
.st{font-weight:900}
.toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.toolbar input,.toolbar select{padding:9px 13px;border:1.5px solid var(--line);border-radius:10px}
.spacer{flex:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:20px}
.stat{background:#fff;border-radius:16px;border:1px solid var(--line);padding:18px 20px}
.stat .v{font-size:28px;font-weight:900;color:var(--navy)}
.stat .l{font-size:13px;color:var(--mut);font-weight:700}
.stat.gold .v{color:var(--gold)}
.stat.green .v{color:var(--green)}
.stat.teal .v{color:var(--blue)}
.empty{text-align:center;color:var(--mut);padding:40px 0;font-weight:700}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:embed}

/* modal */
.modal-wrap{position:fixed;inset:0;background:rgba(10,18,38,.55);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
.modal{background:#fff;border-radius:18px;padding:26px;width:640px;max-width:95vw;max-height:90vh;overflow:auto}
.modal h3{margin-bottom:16px;font-size:18px;color:var(--navy)}
.modal-actions{display:flex;gap:10px;justify-content:flex-start;margin-top:18px}

/* result entry */
.res-grid th,.res-grid td{padding:7px 10px}
input.cell{width:100%;padding:6px 9px;border:1.5px solid var(--line);border-radius:8px;font-size:14px}
.toast{position:fixed;bottom:24px;right:50%;transform:translateX(50%);background:var(--navy);color:#fff;
  padding:12px 26px;border-radius:999px;font-weight:800;font-size:14px;z-index:300;box-shadow:0 10px 30px rgba(0,0,0,.3)}

@media(max-width:800px){.grid2,.grid3,.grid4{grid-template-columns:1fr}}
@media print{.topbar,.toolbar,.back,.no-print{display:none!important}#view{padding:0}}
.sync-badge{font-size:11px;padding:4px 12px;border-radius:20px;font-weight:700;white-space:nowrap}
  .sync-badge.on{background:#e3f4f1;color:#0b6e62}
  .sync-badge.off{background:#eef1f6;color:#8a94a8}
  .sync-badge.warn{background:#fff3e0;color:#e65100}
  .sync-badge.err{background:#ffebee;color:#c62828}
  </style>
</head>
<body>
<div id="root"></div>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="catalog.js"></script>
  <script src="cloud.js"></script>
  <script src="treasury.js"></script>
<script src="app.js"></script>
<script src="https://m-tayea.mtayea.com/signature/mtayea-signature.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () { /* PWA اختياري */ });
  });
}
</script>
</body>
</html>
